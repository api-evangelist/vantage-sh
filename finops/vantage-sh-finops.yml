description: >-
  Vantage is itself a FinOps platform, so this view has two sides. First,
  Vantage is a tool teams adopt to practice FinOps - its API is a primary
  programmatic surface for cloud cost visibility, allocation, and optimization
  across AWS, Azure, GCP, Kubernetes, and other providers, and it ingests and
  normalizes provider billing data (including FOCUS-aligned datasets). Second,
  Vantage's own cost to a customer is a fixed monthly subscription scaled by
  tracked cloud spend, plus an optional Autopilot optimization fee billed at 5%
  of realized savings. A free Starter tier exists for small footprints.
notes: >-
  Vantage supports the FinOps Foundation's FOCUS billing-data standard for
  normalizing multi-cloud cost data; treat its API's Costs and Cost Reports
  surfaces as the machine-readable feed for a FinOps practice. Subscription and
  savings-fee figures should be re-verified during reconciliation.
