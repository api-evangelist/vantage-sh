meters:
- name: tracked_cloud_spend
  description: Monthly cloud spend Vantage tracks for the account; the primary driver of the subscription tier.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - provider
- name: subscription_fee
  description: Fixed monthly subscription fee for the selected Vantage tier.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - plan
- name: autopilot_savings_fee
  description: Optional Autopilot optimization fee, billed at 5% of realized cloud savings.
  unit: usd
  aggregation: sum
  dimensions:
