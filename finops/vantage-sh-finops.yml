principles:
- name: Visibility
  description: Use the Costs and Cost Reports APIs to pull normalized multi-cloud spend, and Resources/Recommendations to see per-resource cost and savings opportunities.
- name: Allocation
  description: Use Segments, Folders, Saved Filters, and Virtual Tags to map cloud cost to teams, products, and cost centers for showback and chargeback.
- name: Optimization
  description: Act on Recommendations and Financial Commitments (RIs, Savings Plans, CUDs); enable Autopilot to automate optimization, priced at 5% of realized savings.
- name: Accountability
  description: Wire Budgets, Budget Alerts, Cost Alerts, and Anomaly Alerts into your own tooling so owners are notified as spend approaches limits or behaves abnormally.
