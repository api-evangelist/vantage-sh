          nullable: false
          example: 2035-09-05+00:00
        amount:
          type: string
          description: The amount of the forecasted cost.
          nullable: false
          example: '4.25'
        provider:
          type: string
          description: The cost provider which incurred the cost. Will be 'all' for all combined providers.
          nullable: false
          example: aws
          enum:
          - aws
          - azure
          - gcp
          - snowflake
          - databricks
          - mongo
          - datadog
          - fastly
          - new_relic
          - opencost
