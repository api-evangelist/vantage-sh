components:
  schemas:
    AccessGrants:
      required:
      - access_grants
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
        access_grants:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrant'
      description: AccessGrants model
    Links:
      type: object
      properties:
        self:
          type: string
          description: The URL of the current page of results.
          nullable: true
        first:
          type: string
          description: The URL of the first page of results.
          nullable: true
        next:
          type: string
          description: The URL of the next page of results, if one exists.
          nullable: true
        last:
          type: string
          description: The URL of the last page of results, if one exists.
          nullable: true
        prev:
          type: string
          description: The URL of the previous page of results, if one exists.
          nullable: true
    AccessGrant:
      required:
      - access
      - created_at
      - created_by
      - resource_token
      - team_token
      - token
      type: object
      properties:
        token:
          type: string
          nullable: false
        resource_token:
          type: string
          description: The token for any resource the AccessGrant is applied to.
          nullable: false
          example: rprt_abcd1234
        access:
          type: string
          description: The access status of the AccessGrant.
          nullable: false
        team_token:
          type: string
          description: The Team token for which an AccessGrant is applied to.
          nullable: true
        created_at:
          type: string
          description: The date and time, in UTC, the AccessGrant was created. ISO 8601 Formatted.
          nullable: false
          example: '2023-08-04T00:00:00Z'
        created_by:
          type: string
          description: The token for the User who created the AccessGrant.
          nullable: true
      description: AccessGrant model
    Errors:
      required:
      - errors
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
        errors:
          type: array
          nullable: false
          items:
            type: string
      description: Errors model
    createAccessGrant:
      required:
      - resource_token
      - team_token
      type: object
      properties:
        resource_token:
          type: string
          description: The token of the resource for which you are granting access.
        team_token:
          type: string
          description: The token of the Team you want to grant access to.
        access:
          type: string
          description: The access level you want to grant. Defaults to 'allowed'.
          enum:
          - denied
          - allowed
      description: Create an Access Grant.
    updateAccessGrant:
      required:
      - access
      type: object
      properties:
        access:
          type: string
          description: Allowed or denied access to resource.
          enum:
          - denied
          - allowed
      description: Update an AccessGrant.
