          type: string
          description: The amount for the BillingRule (Charge).
          nullable: true
          example: '5000.25'
        sql_query:
          type: string
          description: The SQL query for the BillingRule (Custom).
          nullable: true
          example: UPDATE costs SET costs.amount = costs.amount * 0.95
