    BudgetAlerts:
      required:
      - budget_alerts
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
        budget_alerts:
          type: array
          items:
            $ref: '#/components/schemas/BudgetAlert'
      description: BudgetAlerts model
    BudgetAlert:
      required:
      - budget_tokens
      - created_at
      - duration_in_days
      - period_to_track
      - recipient_channels
      - threshold
      - token
      - user_tokens
      - workspace_token
      type: object
      properties:
        token:
          type: string
          nullable: false
        budget_tokens:
          type: array
          description: The tokens for the Budgets that the Budget Alert is monitoring to trigger alerts
            on.
          nullable: false
          items:
            type: string
            example: ''
        created_at:
          type: string
          description: The date and time, in UTC, the Budget Alert was created. ISO 8601 Formatted.
          nullable: false
          example: '2024-03-19T00:00:00Z'
        workspace_token:
          type: string
          description: The token for the Workspace the ResourceReport is a part of.
          nullable: true
        user_token:
          type: string
          description: The token for the User who created this BudgetAlert.
          nullable: true
        user_tokens:
          type: array
          description: The Users that receive the alert.
          nullable: false
          items:
            type: string
            example: ''
        duration_in_days:
          type: integer
          description: The number of days from the start or end of the month to trigger the alert if the
            threshold is reached.
          format: int32
          nullable: true
        threshold:
          type: integer
          description: Alerts only send if they reach this number (as a percentage). When threshold is
            100, that means alerts are triggered once costs reach 100% of the budget.
          format: int32
          nullable: false
          example: 75
        period_to_track:
          type: string
          description: 'The period tracked on the alert. Used with duration_in_days to determine the time
            window of the alert. Possible values: start_of_the_month, end_of_the_month.'
          nullable: true
          example: start_of_the_month
        integration_provider:
          type: string
          description: 'The provider used for sending alerts. This must be configured in the console.
            Possible values are: slack, microsoft_graph.'
          nullable: true
          example: slack
        recipient_channels:
          type: array
          description: The channels receiving the alerts. Requires an integration provider to be connected.
          nullable: true
          items:
            type: string
            example: ''
      description: BudgetAlert model
    createBudgetAlert:
      required:
      - budget_tokens
      - duration_in_days
      - threshold
      type: object
      properties:
        budget_tokens:
          type: array
          description: The tokens of the Budget that has the alert.
          items:
            type: string
        threshold:
          type: integer
          description: The threshold amount that must be met for the alert to fire.
          format: int32
        user_tokens:
          type: array
          description: The tokens of the users that receive the alert.
          items:
            type: string
        duration_in_days:
          type: string
          description: The number of days from the start or end of the month to trigger the alert if the
            threshold is reached.  For the full month, pass an empty value.
        period_to_track:
          type: string
          description: 'The period tracked on the alert. Used with duration_in_days to determine the time
            window of the alert. Defaults to start_of_the_month if not passed. Possible values: start_of_the_month,
            end_of_the_month.'
        recipient_channels:
          type: array
          description: The channels receiving the alerts. Requires an integration provider to be connected.
          items:
            type: string
      description: Create a Budget Alert.
    updateBudgetAlert:
      type: object
      properties:
        budget_tokens:
          type: array
          description: The tokens of the Budget that has the alert.
          items:
            type: string
        threshold:
          type: integer
          description: The threshold amount that must be met for the alert to fire.
          format: int32
        user_tokens:
          type: array
          description: The tokens of the users that receive the alert.
          items:
            type: string
        duration_in_days:
          type: string
          description: The number of days from the start or end of the month to trigger the alert if the
            threshold is reached. For the full month, pass an empty value.
        period_to_track:
          type: string
          description: 'The period tracked on the alert. Used with duration_in_days to determine the time
            window of the alert. Defaults to start_of_the_month if not passed. Possible values: start_of_the_month,
            end_of_the_month.'
        recipient_channels:
          type: array
          description: The channels receiving the alerts. Requires an integration provider to be connected.
          items:
            type: string
      description: Updates an existing BudgetAlert.
