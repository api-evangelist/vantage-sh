          nullable: false
          example: aws
        status:
          type: string
          description: 'The processing status for this provider. Possible values: queued, processing,
            complete, failed.'
          nullable: false
          example: processing
    createVirtualTagConfig:
      required:
      - key
      - overridable
      type: object
      properties:
        key:
          type: string
          description: The key of the VirtualTagConfig.
        overridable:
          type: boolean
          description: Whether the VirtualTagConfig can override a provider-supplied tag on a matching
            Cost.
        backfill_until:
          type: string
          description: The earliest month the VirtualTagConfig should be backfilled to.
          format: date
        collapsed_tag_keys:
          type: array
          description: Tag keys to collapse values for.
          items:
            required:
            - key
            type: object
            properties:
              key:
                type: string
                description: The tag key to collapse values for.
              providers:
                type: array
                description: Provider-only scope for this collapsed tag key. Invalid when filter is set;
                  include provider restrictions in filter instead. Defaults to all providers.
                items:
                  type: string
              filter:
                type: string
                description: The VQL filter this collapsed tag key applies to. When set, do not also set
                  providers; include any provider restrictions directly in filter.
        values:
          type: array
          description: Values for the VirtualTagConfig, with match precedence determined by order in the
            list.
          items:
