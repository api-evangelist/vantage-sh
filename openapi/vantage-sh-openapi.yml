openapi: 3.0.1
info:
  title: Vantage
  description: The Vantage API provides programmatic access to the Vantage cloud cost management and FinOps
    platform. It covers cost reporting and querying (Costs, Cost Reports, forecasts, unit costs), cost
    visibility and optimization (Resources, Recommendations, Financial Commitments, Kubernetes efficiency),
    governance and alerting (Budgets, Budget Alerts, Cost Alerts, Anomaly Alerts and Notifications), organization
    (Segments, Folders, Saved Filters, Dashboards, Workspaces, Teams), and billing (Billing Profiles,
    Billing Rules, Invoices). The API spans AWS, Azure, GCP, Kubernetes, Datadog, Snowflake, MongoDB,
    and other supported providers. Base URL https://api.vantage.sh/v2. Authentication is via OAuth2 (client
    credentials / bearer token) with read and write scopes.
  termsOfService: https://www.vantage.sh/terms-of-use
  contact:
    name: Vantage Support
    url: https://www.vantage.sh
    email: support@vantage.sh
  version: 2.0.0
servers:
- url: https://api.vantage.sh/v2
