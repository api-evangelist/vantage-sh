  /resources/{resource_token}:
    get:
      tags:
      - Resources
      summary: Get resource by token
      description: Return a single Resource
      operationId: getResource
      parameters:
      - name: resource_token
        in: path
        required: true
        schema:
          type: string
      - name: include_cost
        in: query
        description: Include cost information in the response.
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
