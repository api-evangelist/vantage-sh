    - GET    https://api.vantage.sh/v2/me
sources:
  - url: https://docs.vantage.sh/api
    type: Documentation
    note: Vantage API landing page; documents base URL https://api.vantage.sh/v2 and OpenAPI/Swagger spec locations.
  - url: https://vantage.readme.io/reference/general
    type: APIReference
    note: Interactive API reference (ReadMe). All documented operations are HTTPS REST.
  - url: https://vantage.readme.io/reference/authentication
    type: Documentation
    note: OAuth2 client-credentials bearer token; read and write scopes.
  - url: https://api.vantage.sh/v2/oas_v3.json
    type: OpenAPI
    note: Published OpenAPI 3.0.1 specification, 110 paths, single https server https://api.vantage.sh/v2. No WebSocket channels.
  - url: https://api.vantage.sh/v2/swagger.json
    type: OpenAPI
    note: Swagger/OAS 2.0 rendering of the same contract.
  - url: https://github.com/vantage-sh
    type: SourceCode
    note: Open-source API clients (vantage-python, vantage-js) and Terraform provider; the platform itself is commercial SaaS.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Vantage's own public API is
    request/response REST described by a published OpenAPI 3.0.1 document,
    with no server-push transport (WebSocket or SSE) to model. Asynchronous
    notifications are delivered to external channels (email, Slack, Teams,
    PagerDuty, webhooks) that carry their own protocols, so no AsyncAPI
    document was created.
