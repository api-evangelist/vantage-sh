    - GET    https://api.vantage.sh/v2/recommendations
    - GET    https://api.vantage.sh/v2/recommendations/{recommendation_token}
    - GET    https://api.vantage.sh/v2/budgets
    - POST   https://api.vantage.sh/v2/budgets
    - GET    https://api.vantage.sh/v2/budget_alerts
    - GET    https://api.vantage.sh/v2/cost_alerts
    - POST   https://api.vantage.sh/v2/cost_alerts
    - GET    https://api.vantage.sh/v2/cost_alerts/{cost_alert_token}/events
    - GET    https://api.vantage.sh/v2/anomaly_alerts
    - GET    https://api.vantage.sh/v2/anomaly_notifications
    - GET    https://api.vantage.sh/v2/segments
    - POST   https://api.vantage.sh/v2/segments
    - GET    https://api.vantage.sh/v2/dashboards
    - POST   https://api.vantage.sh/v2/dashboards
    - GET    https://api.vantage.sh/v2/financial_commitments
    - GET    https://api.vantage.sh/v2/financial_commitment_reports
